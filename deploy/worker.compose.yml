services:
  stalwart:
    image: stalwartlabs/stalwart:v0.16
    restart: unless-stopped
    profiles: ["mail-server"]
    environment:
      STALWART_PUBLIC_URL: https://mail.globetrotr.nl
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
      - "443:443"
      - "127.0.0.1:8080:8080"
    volumes:
      - stalwart-etc:/etc/stalwart
      - stalwart-data:/var/lib/stalwart
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    expose:
      - "3310"
    volumes:
      - clamav-data:/var/lib/clamav:rw
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc 127.0.0.1 3310 | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
  translation:
    image: libretranslate/libretranslate:v1.9.6
    restart: unless-stopped
    profiles: ["translation"]
    environment:
      LT_LOAD_ONLY: en,nl
      LT_DISABLE_WEB_UI: "true"
      # Corporate HTML email includes markup and may legitimately be larger
      # than the visible message. Keep this aligned with the server-side
      # translation validation limit.
      LT_CHAR_LIMIT: "30000"
      LT_REQ_LIMIT: "60"
      LT_THREADS: "2"
    ports:
      - "${TRANSLATION_BIND_ADDRESS:-127.0.0.1}:5000:5000"
    volumes:
      - translation-data:/home/libretranslate/.local:rw
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/languages', timeout=5)",
        ]
      interval: 30s
      timeout: 8s
      retries: 10
      start_period: 90s

  mail-relay:
    build:
      context: ..
      target: worker-runtime
    command: ["node", "worker/mail-relay.mjs"]
    restart: unless-stopped
    env_file: ../.env.mail-relay
    expose:
      - "9092"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9092/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 8s
      retries: 4

  worker:
    build:
      context: ..
      target: worker-runtime
    command: ["node", "worker/index.mjs"]
    restart: unless-stopped
    depends_on:
      mail-relay:
        condition: service_healthy
      clamav:
        condition: service_healthy
    env_file: ../.env.production
    ports:
      - "${WORKER_BIND_ADDRESS:-127.0.0.1}:9091:9091"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9091/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 8s
      retries: 4

  imap-sync:
    build:
      context: ..
      target: worker-runtime
    command: ["node", "worker/imap-sync.mjs"]
    restart: unless-stopped
    env_file: ../.env.production
    depends_on:
      worker:
        condition: service_healthy
      clamav:
        condition: service_healthy

volumes:
  translation-data:
  clamav-data:
  stalwart-etc:
  stalwart-data:
