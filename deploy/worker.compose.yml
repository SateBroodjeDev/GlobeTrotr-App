services:
  mail-relay:
    build:
      context: ..
      target: worker-runtime
    command: ["node", "worker/mail-relay.mjs"]
    restart: unless-stopped
    env_file: ../.env.mail-relay
    expose:
      - "9092"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9092/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 4

  worker:
    build:
      context: ..
      target: worker-runtime
    command: ["node", "worker/index.mjs"]
    restart: unless-stopped
    depends_on:
      mail-relay:
        condition: service_healthy
    env_file: ../.env.production
    ports:
      - "${WORKER_BIND_ADDRESS:-127.0.0.1}:9091:9091"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9091/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 4

  imap-sync:
    build:
      context: ..
      target: worker-runtime
    command: ["node", "worker/imap-sync.mjs"]
    restart: unless-stopped
    env_file: ../.env.production
    depends_on:
      worker:
        condition: service_healthy
