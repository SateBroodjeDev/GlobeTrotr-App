services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env.production
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3
  worker:
    build: .
    command: ["node", "worker/index.mjs"]
    restart: unless-stopped
    env_file: .env.production
    expose: ["9091"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9091/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 4
