name: Quality checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node installeren
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Dependencies installeren
        run: npm ci
      - name: Changelog en opslag testen
        run: npm test
      - name: Productiebuild controleren
        run: npm run build
