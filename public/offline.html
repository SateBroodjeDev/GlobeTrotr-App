<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f766e"><title>GlobeTrotr · Offline</title>
<style>:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#102039;background:#f4f7f6}*{box-sizing:border-box}body{margin:0}.wrap{max-width:880px;margin:auto;padding:24px 16px 64px}header{display:flex;align-items:center;gap:12px;margin-bottom:24px}header img{width:42px;height:42px}.muted{color:#65736e}.card{background:#fff;border:1px solid #dfe7e4;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 1px 2px #1020390a}h1{font-size:1.5rem;margin:0}h2{font-size:1rem;margin:0 0 12px}h3{font-size:.95rem;margin:18px 0 8px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.item{border-top:1px solid #e8eeec;padding:12px 0}.item:first-child{border:0;padding-top:0}.field{width:100%;padding:10px 12px;border:1px solid #bccbc6;border-radius:9px;background:#fff;color:#102039;font:inherit}.form{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.pill{display:inline-block;border-radius:999px;background:#d9f3ed;color:#086958;padding:4px 9px;font-size:.75rem}.notice{padding:12px;border-radius:10px;background:#fff7e6;color:#6d521a;font-size:.85rem}@media(max-width:600px){.row{align-items:flex-start;flex-direction:column}.card{padding:15px}.form{grid-template-columns:1fr}}</style></head>
<body><main class="wrap"><header><img src="/assets/email/logo.png" alt=""><div><strong>GlobeTrotr</strong><div class="muted" id="offlineLabel">Offline trip view</div></div></header><div id="app"><div class="card">Loading saved trip…</div></div></main>
<script>
const tripId=new URLSearchParams(location.search).get("trip"),app=document.getElementById("app");
const el=(tag,text,cls)=>{const node=document.createElement(tag);if(text!=null)node.textContent=text;if(cls)node.className=cls;return node};
function db(){return new Promise((resolve,reject)=>{const r=indexedDB.open("globetrotr-offline-v1",1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("trip-packs"))r.result.createObjectStore("trip-packs",{keyPath:"tripId"})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function request(mode,run){return db().then(database=>new Promise((resolve,reject)=>{const r=run(database.transaction("trip-packs",mode).objectStore("trip-packs"));r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)}))}
const read=()=>request("readonly",store=>store.get(tripId)),write=pack=>request("readwrite",store=>store.put(pack));
function addItem(parent,title,detail){const item=el("div",null,"item");item.append(el("strong",title));if(detail)item.append(el("div",detail,"muted"));parent.append(item)}
function select(values){const node=el("select",null,"field");values.forEach(([value,label])=>{const option=el("option",label);option.value=value;node.append(option)});return node}
function render(pack){
  pack.queuedExpenses=pack.queuedExpenses||[];pack.payers=pack.payers||[];const nl=pack.locale==="nl";
  document.documentElement.lang=pack.locale;document.getElementById("offlineLabel").textContent=nl?"Offline reisoverzicht":"Offline trip view";app.replaceChildren();
  const hero=el("section",null,"card"),top=el("div",null,"row"),title=el("div");title.append(el("h1",pack.name),el("div",`${pack.start} – ${pack.end}`,"muted"));top.append(title,el("span",nl?"Op apparaat opgeslagen":"Saved on device","pill"));hero.append(top,el("p",`${nl?"Bijgewerkt":"Updated"}: ${new Date(pack.savedAt).toLocaleString(pack.locale)}`,"muted"));app.append(hero);
  const picker=el("section",null,"card");picker.append(el("h2",nl?"Kies een reisdag":"Choose a trip day"));const day=el("input");day.type="date";day.className="field";day.min=pack.start;day.max=pack.end;const today=new Date().toLocaleDateString("en-CA");day.value=today>=pack.start&&today<=pack.end?today:pack.start;picker.append(day);app.append(picker);
  const content=el("div");app.append(content);
  function show(date){content.replaceChildren();const stop=[...pack.stops].reverse().find(s=>!s.arrive||s.arrive<=date)||pack.stops[0],planning=pack.itinerary.filter(x=>x.day===date),bookings=pack.travelItems.filter(x=>x.date===date||(x.endDate&&x.date<=date&&x.endDate>=date));const overview=el("section",null,"card");overview.append(el("h2",new Date(date+"T12:00:00").toLocaleDateString(pack.locale,{weekday:"long",day:"numeric",month:"long",year:"numeric"})));if(stop)addItem(overview,stop.name,stop.country);overview.append(el("h3",nl?"Planning":"Schedule"));planning.length?planning.forEach(x=>addItem(overview,x.title,x.notes)):overview.append(el("p",nl?"Geen planning voor deze dag.":"No schedule for this day.","muted"));overview.append(el("h3",nl?"Boekingen":"Bookings"));bookings.length?bookings.forEach(x=>addItem(overview,x.title,[x.startTime&&x.endTime?x.startTime+"–"+x.endTime:x.startTime,x.provider,x.flightNumber,x.departure&&x.arrival?x.departure+" → "+x.arrival:x.location].filter(Boolean).join(" · "))):overview.append(el("p",nl?"Geen boekingen voor deze dag.":"No bookings for this day.","muted"));content.append(overview,el("p",nl?"Dit is een lokaal opgeslagen kopie. Werk het pakket online bij om wijzigingen te ontvangen.":"This is a locally saved copy. Update it online to receive changes.","notice"))}
  day.addEventListener("change",()=>show(day.value));show(day.value);
  if(pack.payers.length){const card=el("section",null,"card");card.append(el("h2",nl?"Uitgave offline bewaren":"Save expense offline"),el("p",nl?"Deze uitgave blijft op dit apparaat totdat je haar online bewust synchroniseert.":"This expense remains on this device until you explicitly sync it online.","muted"));const form=el("form",null,"form"),description=el("input",null,"field"),amount=el("input",null,"field");description.placeholder=nl?"Omschrijving":"Description";description.maxLength=120;description.required=true;amount.type="number";amount.inputMode="decimal";amount.min="0.01";amount.max="100000000";amount.step="0.01";amount.placeholder=nl?"Bedrag":"Amount";amount.required=true;const category=select([["food",nl?"Eten en drinken":"Food and drink"],["transport",nl?"Vervoer":"Transport"],["lodging",nl?"Verblijf":"Lodging"],["activities",nl?"Activiteiten":"Activities"],["shopping",nl?"Winkelen":"Shopping"],["other",nl?"Overig":"Other"]]),currency=select(["EUR","USD","GBP","SEK","NOK","DKK","CHF"].map(x=>[x,x])),payer=select(pack.payers.map(x=>[x.id,x.name])),submit=el("button",nl?"Bewaar op dit apparaat":"Save on this device","field");submit.type="submit";form.append(description,amount,category,currency,payer,submit);form.addEventListener("submit",event=>{event.preventDefault();const value=Number(amount.value),name=description.value.trim();if(!name||!Number.isFinite(value)||value<=0||pack.queuedExpenses.length>=50)return;pack.queuedExpenses.push({id:crypto.randomUUID(),date:day.value,title:name,category:category.value,amount:value,currency:currency.value,paidBy:payer.value,billable:false,queuedAt:new Date().toISOString()});write(pack).then(()=>render(pack))});card.append(form);if(pack.queuedExpenses.length)card.append(el("p",`${pack.queuedExpenses.length} ${nl?"uitgave(n) wachten op synchronisatie":"expense(s) waiting to sync"}`,"notice"));app.append(card)}
}
if(!tripId)app.replaceChildren(el("div","No trip was selected.","card"));else read().then(pack=>pack?render(pack):app.replaceChildren(el("div","This trip is not saved on this device.","card"))).catch(()=>app.replaceChildren(el("div","The offline trip could not be opened.","card")));
</script></body></html>
